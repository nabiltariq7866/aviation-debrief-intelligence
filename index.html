<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <meta name="theme-color" content="#0B0B0D"/>
    <title>Operational Learning Intelligence</title>
    <script>
      (function () {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
        var theme = 'dark'
        try {
          var savedTheme = localStorage.getItem('aviation-theme')
          if (savedTheme === 'light' || savedTheme === 'dark') theme = savedTheme
        } catch (_) {}
        document.documentElement.classList.add(theme)
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <style>
      html, body, #root { margin: 0; min-height: 100%; background: #0B0B0D; }
      html.light, html.light body, html.light #root { background: #F7F7F9; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
